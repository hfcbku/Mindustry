name: name: Build‑APK‑104
on:
  workflow_dispatch:

jobs:
  build:
    runs‑on: ubuntu‑latest
    steps:
      # 拉取代码，指定Build‑104提交哈希
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: 0cbd9a1

      # Build104老版本必须JDK11
      - name: Setup JDK 11
        uses: actions/setup‑java@v4
        with:
          java‑version: '11'
          distribution: temurin

      # 编译安卓APK，Mindustry是android模块，不是app
      - name: Build Android APK
        run: ./gradlew android:assembleDebug

      # 上传编译输出的APK文件
      - name: Upload APK
        uses: actions/upload‑artifact@v3
        with:
          name: mindustry‑104‑apk
          path: android/build/outputs/apk/debug/android‑debug.apk

